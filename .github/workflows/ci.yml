name: CI

on:
  push:
  pull_request:

# Cancel older runs on the same ref so only the newest commit is checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Use `npm ci` when a lockfile is present, fall back to `npm install`
        # so the workflow also works on freshly created Lovable projects.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Lint — no smart quotes
        run: npm run lint:smart-quotes
